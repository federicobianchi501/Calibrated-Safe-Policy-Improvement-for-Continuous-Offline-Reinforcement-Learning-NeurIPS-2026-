[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrated-safe-policy-improvement"
version = "1.0.0"
description = "Reference implementation of Cal-SPI for the NeurIPS 2026 submission."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "gymnasium==1.0.0",
    "gymnasium-robotics==1.3.1",
    "stable-baselines3==2.4.1",
    "mujoco==3.1.6",
    "torch==2.4.1",
    "numpy==1.24.4",
    "numba==0.58.1",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.ruff]
select = ["E", "F", "W"]
line-length = 88
